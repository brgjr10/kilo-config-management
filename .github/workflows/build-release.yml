name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ttkbootstrap Pillow

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed kilo_manager.py

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/kilo_manager AppDir/usr/bin/
          cp kilo-manager.desktop AppDir/
          cp AppRun AppDir/
          cp kilo-manager.png AppDir/kilo-manager.png
          chmod +x AppDir/usr/bin/kilo_manager AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool.AppImage AppDir kilo_manager-x86_64.AppImage

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilo-manager-exe
          path: dist/kilo_manager

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilo-manager-appimage
          path: kilo_manager-x86_64.AppImage

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: kilo-manager-exe
          path: dist/

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: kilo-manager-appimage
          path: dist/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/kilo_manager,dist/kilo_manager-x86_64.AppImage"
          token: ${{ secrets.GITHUB_TOKEN }}
